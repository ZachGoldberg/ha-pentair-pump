ensure_speed:
  name: Ensure heating speed
  description: >-
    Raise the pool pump to the heating minimum (heat_min_rpm) and wait until it is running that fast.
    Call before turning a heater on. Fails if the pump doesn't get there in time.
  fields:
    timeout:
      name: Timeout
      description: Seconds to wait for the pump to reach speed.
      default: 45
      selector:
        number:
          min: 1
          max: 300
          unit_of_measurement: s
    raise_on_failure:
      name: Raise on failure
      description: Fail the action (stopping the calling script) if the speed isn't reached.
      default: true
      selector:
        boolean:
